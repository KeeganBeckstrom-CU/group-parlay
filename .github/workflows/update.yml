name: Update games and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"   # wakes every 5 minutes, but only contacts ESPN when a game should be over (or once a day for the schedule)
  workflow_dispatch:
    inputs:
      stats:
        description: "Also refresh team records and top players"
        type: boolean
        default: false
      force:
        description: "Re-check the schedule now"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: parlay-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull schedule and scores
        id: run
        run: node scripts/update.mjs
        env:
          STATS: ${{ inputs.stats && '1' || '' }}
          FORCE: ${{ inputs.force && '1' || '' }}
      - name: Save changes
        if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "parlay-bot"
          git config user.email "parlay-bot@users.noreply.github.com"
          git add games.json teams.json
          git commit -m "Update games and scores"
          git push

  publish:
    needs: update
    if: github.event_name != 'schedule' || needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
